name: CI

# Every pull request and every push to main: install, the token check, the
# contrast check (docs/design-system.md, "Contrast"), the checks' own tests,
# and the gallery's build. On main, the gallery is published with GitHub
# Pages. Actions are pinned to commit SHAs; each job has only the
# permissions it needs and a time limit well above its usual time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request's branch cancels that pull request's run still
# in progress; every other run has a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Checks and gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Every look sets every token
        run: npm run check:tokens
      - name: Contrast (WCAG AA, both looks, both themes)
        run: npm run check:contrast
      - name: Tests
        run: npm test
      - name: Build the gallery
        run: npm run build:gallery
      - name: Hand the gallery to Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-gallery

  # The gallery on GitHub Pages, from main only.
  pages:
    name: Publish the gallery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
